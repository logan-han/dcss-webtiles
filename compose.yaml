# Synology Container Manager project. Change the image tag, host port and volume path to taste.
# The image has its own healthcheck.
services:
  dcss:
    image: docker.io/loganhan123/dcss-webtiles:latest
    container_name: dcss
    ports:
      - "8080:8080"
    volumes:
      - /volume1/docker/dcss/data:/data
    # uid:gid that owns the volume on the NAS (DSM users are usually 1026+ in group 100)
    user: "1026:100"
    # environment:
    #   LOBBY_URL: "http://<nas>:<port>/"   # completes `webserver/wtutil.py password --reset` links
    restart: unless-stopped
    # the server writes only to /data and /tmp
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
